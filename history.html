      function getDatasetFromQuery() {
        const params = new URLSearchParams(window.location.search);
        return params.get("dataset") || "set1";
      }

      function getRuleFromQuery() {
        const params = new URLSearchParams(window.location.search);
        return params.get("rule") || "";
      }

      function renderHistory(datasetKey, ruleName) {
        const history = DATASETS_HISTORY[datasetKey] || [];
        const container = document.getElementById("history-container");
        container.innerHTML = "";

        history.forEach((h) => {
          if (ruleName && h.name !== ruleName) {
            return; // показываем только выбранное правило
          }
          const row = document.createElement("div");
          row.className = "history-row";
          row.innerHTML = `
            <span>${h.name}</span>
            <span>${h.start}</span>
            <span>${h.end}</span>
            <span>${h.status}</span>
            <span>${h.count}</span>
          `;
          const divider = document.createElement("div");
          divider.className = "divider";
          container.appendChild(row);
          container.appendChild(divider);
        });
      }

      const dataset = getDatasetFromQuery();
      const ruleName = getRuleFromQuery();
      // обновляем ссылку "Назад", чтобы вернуться к тем же правилам
      const backLink = document.getElementById("back-link");
      backLink.href = `rules.html?dataset=${dataset}`;

      renderHistory(dataset, ruleName);
